name: Docker

on:
  push:
    branches: [main]
  # No base-branch filter, same as test.yml: stacked PRs target other feature
  # branches and would otherwise get no image build at all.
  pull_request:
  release:
    types: [published]
  # Called by release.yml, whose own release doesn't trigger `release: published`.
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v, e.g. 0.34.0
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  build_and_push:
    name: Build and Push
    runs-on: ubuntu-latest
    # A healthy multi-arch build takes a few minutes. Stop a stuck one early
    # instead of letting it run to the 6 hour job limit.
    timeout-minutes: 30
    strategy:
      # Prevent a failure in one image from stopping the other builds
      fail-fast: false
      matrix:
        include:
          - context: "."
            file: "Dockerfile"
            image: "mini-qr"
            platforms: "linux/arm64,linux/amd64"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # From release.yml, build the release tag rather than the commit the
          # workflow was started on (the tag adds the version bump on top).
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      
      - name: Set up Docker Buildx
        # Uses the action's default (current stable) BuildKit. It used to be
        # pinned to v0.10.6 to work around docker/build-push-action#761, but
        # that version can't attach provenance or an SBOM and no longer gets
        # fixes.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        # Skip when PR from a fork
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize unfortunate names
        id: sanitize_names
        uses: ASzc/change-string-case-action@07c1e24a97f0951e13f88870b99c058fcf0b14cf # v5
        with:
          string: ${{ github.repository_owner }}

      - name: Generate docker image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # Only builds from main move the `latest` tag. PR builds get pr-N and
          # releases (published by hand or from release.yml) get their version
          # tag plus `release`.
          flavor: |
            latest=false
          images: |
            name=ghcr.io/${{ steps.sanitize_names.outputs.lowercase }}/${{matrix.image}}
          tags: |
            type=raw,value=latest,enable=${{ !inputs.version && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # Tag with branch name
            type=ref,event=branch,enable=${{ !inputs.version }}
            # Tag with pr-number
            type=ref,event=pr
            # Tag with git tag on release
            type=ref,event=tag
            # Tag with the version when called from release.yml
            type=raw,value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=release,enable=${{ github.event_name == 'release' || !!inputs.version }}

      - name: Determine build cache output
        id: cache-target
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Essentially just ignore the cache output (PR can't write to registry cache)
            echo "cache-to=type=local,dest=/tmp/discard,ignore-error=true" >> $GITHUB_OUTPUT
          else
            echo "cache-to=type=registry,mode=max,ref=ghcr.io/${{ steps.sanitize_names.outputs.lowercase }}/mini-qr-build-cache:${{ matrix.image }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          # Skip pushing when PR from a fork
          push: ${{ !github.event.pull_request.head.repo.fork }}
          # Attach a build provenance record and an SBOM to every pushed image,
          # so self-hosters can check how it was built and what it contains.
          provenance: ${{ !github.event.pull_request.head.repo.fork && 'mode=max' || 'false' }}
          sbom: ${{ !github.event.pull_request.head.repo.fork }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.sanitize_names.outputs.lowercase }}/mini-qr-build-cache:${{matrix.image}}
          cache-to: ${{ steps.cache-target.outputs.cache-to }}
          build-args: |
            VITE_APP_VERSION=${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
