---
services:
  mini-qr:
    image: ghcr.io/lyqht/mini-qr:latest
    container_name: mini-qr
    restart: unless-stopped
    # Read when the container starts. Set them in your shell or in a .env file
    # next to this file. See SELF_HOSTING.md for what each one does.
    environment:
      HIDE_CREDITS: ${HIDE_CREDITS:-}
      DEFAULT_PRESET: ${DEFAULT_PRESET:-}
      DEFAULT_DATA: ${DEFAULT_DATA:-}
      DEFAULT_LOGO: ${DEFAULT_LOGO:-}
      PRESETS: ${PRESETS:-}
      FRAME_PRESET: ${FRAME_PRESET:-}
      FRAME_PRESETS: ${FRAME_PRESETS:-}
      DISABLE_LOCAL_STORAGE: ${DISABLE_LOCAL_STORAGE:-}
      QR_CREATE_SIMPLE_FULL_MODE_TOGGLE: ${QR_CREATE_SIMPLE_FULL_MODE_TOGGLE:-}
      FIELDS_VISIBLE: ${FIELDS_VISIBLE:-}
      DISABLE_COLOR_CONTRAST_WARNING: ${DISABLE_COLOR_CONTRAST_WARNING:-}
    # The app only serves static files, so it needs no Linux capabilities and
    # must never gain privileges. The filesystem stays writable because the
    # entrypoint writes dist/config.js from the settings above on every start.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - mini-qr-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - 80:80
    restart: unless-stopped
    configs:
      - source: nginx-proxy-conf
        target: /etc/nginx/nginx.conf
    depends_on:
      - mini-qr
    networks:
      - mini-qr-network

configs:
  nginx-proxy-conf:
    content: |
      events {
          worker_connections 1024;
      }
      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;
          sendfile      on;
          keepalive_timeout 65;
          upstream mini-qr-backend {
              server mini-qr:8080;
          }
          server {
              listen 80;
              server_name localhost;
              location / {
                  proxy_pass http://mini-qr-backend;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }
              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
              }
              error_page 500 502 503 504 /50x.html;
              location = /50x.html {
                  root /usr/share/nginx/html;
              }
          }
      }

networks:
  mini-qr-network:
    driver: bridge
